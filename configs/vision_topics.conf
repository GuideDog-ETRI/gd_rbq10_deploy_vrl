# 비전 DDS 토픽 이름. VisionStudentThread(Pilot)와 student-decoder-viewer가 같은 파일을 읽는다.
# 경로: 환경변수 RBQ_VISION_TOPICS, 없으면 작업 폴더의 configs/vision_topics.conf, 없으면 아래와 같은 기본값.
# {i} 는 벨리 카메라 번호 0..3 (BT0..BT3) 으로 바뀐다.

# 벨리 카메라 깊이 (16비트 PNG, mm)
depth = rt/rbq/vision/sensor_{i}/depth/compressed
# 벨리 카메라 IR (그레이스케일 JPEG)
ir = rt/rbq/vision/sensor_{i}/ir/compressed
# MuJoCo 시뮬레이터 상태 (GAST 교사 oracle 자세, 시뮬레이터 전용)
sim_state = rt/rbq/_sim
